# `QuestDbSinkFixture::connectors_runtime_envs` overrides the plugin path, the
# connect string, the table and every `[[streams]]` key at run time, so those
# values are structural rather than meaningful. The `[transforms.delete_fields]`
# block below is the only part of this file specific to the test.

type = "sink"
key = "questdb"
enabled = true
version = 0
name = "QuestDB sink"
path = "libiggy_connector_questdb_sink"
verbose = false

[[streams]]
stream = "test_stream"
topics = ["test_topic"]
schema = "json"
batch_length = 100
consumer_group = "questdb_sink_cg"

# The README's fixes for a payload field that collides with the auto-created
# designated timestamp or with a reserved column.
[transforms.delete_fields]
enabled = true
fields = ["timestamp", "iggy_stream"]

[plugin_config]
connection_string = "ws::addr=localhost:9000;"
table = "iggy_events"
