# Change detection for pre-merge. A component runs its tasks when one of its
# paths changes, or when a component that it depends on changes. Which tests
# run inside the Rust lane is up to cargo-rail and .config/rail.toml.
components:
  # Workspace-level changes that affect all Rust components. The root
  # Cargo.toml also holds the core pin, the apache/iggy commit of the
  # core crates.
  rust-workspace:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"

  # CI/CD infrastructure changes that require full regression
  ci-infrastructure:
    paths:
      - ".github/**"

  # crates.io publish chain verification. Runs scripts/verify-sdk-publish.sh,
  # which spins up cargo-http-registry as a local alt-registry and publishes
  # the core crates at the core pin and then the SDK.
  rust-sdk-publish:
    depends_on:
      - "rust-workspace"
      - "ci-infrastructure"
    paths:
      - "sdk/Cargo.toml"
      - "scripts/verify-sdk-publish.sh"
      - "scripts/ci/lib/core-pin.sh"
    tasks:
      - "verify-publish"

  # MSRV gate for the SDK, the only crate of this repository on crates.io.
  # Source-scoped (not just Cargo.toml) because an MSRV break usually comes
  # from a crate using an API newer than the floor.
  rust-sdk-msrv:
    depends_on:
      - "rust-workspace"
      - "ci-infrastructure"
    paths:
      - "sdk/**"
    tasks:
      - "check-msrv"

  rust:
    depends_on:
      - "rust-workspace"
      - "ci-infrastructure"
    paths:
      - "runtime/**"
      - "sdk/**"
      - "sinks/**"
      - "sources/**"
      - "testing/**"
      - ".config/**" # nextest and cargo-rail configuration
      - "scripts/build-test-server.sh"
      - "scripts/ci/lib/core-pin.sh"
    tasks:
      - "check"
      - "fmt"
      - "clippy"
      - "sort"
      - "doctest"
      - "machete"
      - "test"
      - "build-aarch64-gnu"
      - "build-aarch64-musl"
      - "build-macos-aarch64"
      - "clippy-macos-aarch64"

  # Image build of apache/iggy-connect, without a push
  docker-connectors:
    depends_on:
      - "rust-workspace"
    paths:
      - "runtime/**"
      - "sdk/**"
      - ".dockerignore"
      - ".github/actions/utils/docker-buildx/**"
    tasks:
      - "build-image"
