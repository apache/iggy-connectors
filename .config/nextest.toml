# Floor for the flags CI passes: --no-tests (0.9.75), archive -E (0.9.109)
# and --partition slice (0.9.127). nextest refuses to run below it. setup-rust
# installs a pinned version above this floor.
nextest-version = { required = "0.9.127" }

[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
retries = 3
