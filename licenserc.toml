[header]
path = "ASF_LICENSE.txt"
keywords = ["Licensed to the Apache Software Foundation"]

[files]
root = "."
excludes = [
    "**/target/**",
    "**/.idea/**",
    "**/.vscode/**",
    "**/local_data*/**",
    "**/*.lock",
    "**/*.txt",
    "**/LICENSE",
    "LICENSE",
    "NOTICE",
    "**/NOTICE",
    "**/.gitignore",
    "**/.dockerignore",
    "**/CODEOWNERS",
    "**/*.md",
    "**/*.hbs",
    "**/*.json",
    "**/*.pem",
    "**/.env",
    "**/.gitkeep",
    ".github/config/hawkeye.version",
]

[[rules]]
extensions = [
    "rs",
]
style_out = "doubleslash"
styles_in = ["doubleslash", "slashstar", "javadoc"]

[[rules]]
filenames = [
    "Dockerfile",
]
extensions = [
    "http",
    "map",
    "sh",
    "toml",
    "yaml",
    "yml",
]
style_out = "script"

[[rules]]
extensions = [
    "fbs",
    "proto",
]
style_out = "slashstar"

[git]
ignore = "auto"
file_attrs = "disable"
