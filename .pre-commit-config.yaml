default_stages: [pre-commit]
default_install_hook_types: [pre-commit, pre-push]

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: mixed-line-ending

  # CI scripts
  - repo: local
    hooks:
      - id: markdownlint
        name: markdownlint
        entry: ./scripts/ci/markdownlint.sh
        args: ["--fix"]
        language: system
        types: [markdown]
        pass_filenames: true

      - id: shellcheck
        name: shellcheck
        entry: ./scripts/ci/shellcheck.sh
        args: ["--fix"]
        language: system
        types: [shell]
        pass_filenames: true

      - id: license-headers
        name: license headers
        entry: ./scripts/ci/license-headers.sh
        args: ["--fix"]
        language: system
        pass_filenames: true

      - id: rust-version-sync
        name: rust version sync
        entry: ./scripts/ci/sync-rustc-version.sh
        args: ["--fix"]
        language: system
        files: ^rust-toolchain\.toml$
        pass_filenames: false

      - id: version-consistency
        name: version consistency
        entry: ./scripts/extract-version.sh
        args: ["--check"]
        language: system
        files: ^(Cargo\.toml|sdk/Cargo\.toml|\.github/config/publish\.yml)$
        pass_filenames: false

      # On pre-push, because cargo metadata --locked can fetch apache/iggy
      # at the core pin.
      - id: core-pin
        name: core pin
        entry: ./scripts/ci/check-core-pin.sh
        language: system
        files: ^Cargo\.(toml|lock)$
        pass_filenames: false
        stages: [pre-push]

      - id: trailing-whitespace
        name: trailing whitespace
        entry: ./scripts/ci/trailing-whitespace.sh
        args: ["--fix"]
        language: system
        types: [text]
        pass_filenames: true

      - id: trailing-newline
        name: trailing newline
        entry: ./scripts/ci/trailing-newline.sh
        args: ["--fix"]
        language: system
        types: [text]
        pass_filenames: true

      - id: binary-artifacts
        name: binary artifacts
        entry: ./scripts/ci/binary-artifacts.sh
        args: ["--check"]
        language: system
        pass_filenames: true

      - id: typos
        name: typos (spelling check)
        entry: typos
        args: ["--force-exclude", "-w"]
        language: system
        types: [ text ]
        pass_filenames: true

      - id: skills
        name: skills (AI agent skill frontmatter + link check)
        entry: ./scripts/ci/skills.sh
        language: system
        always_run: true
        pass_filenames: false

      - id: taplo
        name: taplo (TOML format)
        entry: ./scripts/ci/taplo.sh
        args: ["--fix"]
        language: system
        types: [toml]
        pass_filenames: true

  # Rust
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-sort
        name: cargo sort
        entry: cargo sort --no-format --workspace
        language: system
        files: (^|/)Cargo\.toml$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy
        args:
          [
            "--all-features",
            "--all-targets",
            "--manifest-path",
            "Cargo.toml",
            "--",
            "-D",
            "warnings",
          ]
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
