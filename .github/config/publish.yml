components:

  # ── Rust crates (crates.io) ────────────────────────────────────────────────
  rust-connector-sdk:
    tag_pattern: "^connectors-sdk-([0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?)$"
    registry: crates
    package: iggy_connector_sdk
    version_file: "sdk/Cargo.toml"
    version_regex: '(?m)^\s*version\s*=\s*"([^"]+)"'

  # ── DockerHub images ───────────────────────────────────────────────────────
  # Post-merge refreshes each image's :edge tag only when its row in
  # .github/config/edge-image-variants.json selects it. Every dockerhub
  # component needs a row that lists its dockerfile. The common checks run
  # scripts/ci/edge-image-catalog.sh --check to enforce that.
  rust-connectors:
    tag_pattern: "^connectors-([0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?)$"
    registry: dockerhub
    image: apache/iggy-connect
    dockerfile: runtime/Dockerfile
    platforms: ["linux/amd64", "linux/arm64"]
    version_file: "runtime/Cargo.toml"
    version_regex: '(?m)^\s*version\s*=\s*"([^"]+)"'
