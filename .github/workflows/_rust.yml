name: _rust
on:
  workflow_call:
    inputs:
      plan:
        description: "JSON with checks (component/task entries)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.task }}
    if: ${{ fromJSON(inputs.plan).checks[0] != null }}
    strategy:
      fail-fast: true
      # Keeps pre-merge at 20 concurrent jobs or fewer, the ASF limit.
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(inputs.plan).checks }}
    runs-on: ${{
      (matrix.task == 'build-aarch64-gnu' || matrix.task == 'build-aarch64-musl') && 'ubuntu-26.04-arm' ||
      (matrix.task == 'build-macos-aarch64' || matrix.task == 'clippy-macos-aarch64') && 'macos-15' ||
      'ubuntu-26.04'
      }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run Rust check
        uses: ./.github/actions/rust/pre-merge
        with:
          task: ${{ matrix.task }}
          component: ${{ matrix.component }}
