# Coverage baseline for Rust. Runs on push to master so Codecov has data on
# master SHAs for the PR builds to compare with. It also saves the build
# cache and the test server that pre-merge restores. workflow_dispatch
# forces a run (manual backfill).

name: Coverage baseline

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - ".agents/**"
      - ".claude/**"
  workflow_dispatch:

permissions:
  contents: read

# Per-event groups so a manual backfill run is not cancelled by the next
# merge push (and vice versa).
concurrency:
  group: coverage-baseline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # workflow_dispatch offers a branch picker, but baseline uploads and cache
  # warms only make sense for master.
  test-server:
    name: Test server
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/_build_ci_artifacts.yml
    with:
      task: test-server
      timeout-minutes: 60

  rust-test-build:
    name: Rust test artifacts
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/_build_ci_artifacts.yml
    with:
      task: test-build
      test-scope: workspace
      save-cache: true

  rust-coverage:
    name: Rust
    needs: [test-server, rust-test-build]
    uses: ./.github/workflows/_rust_tests.yml
    with:
      timeout-minutes: 120
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
