# Tests launch these artifacts at run time, an edge Cargo cannot record: each
# integration test target spawns `iggy-connectors` through `Command::cargo_bin`,
# and the runtime dlopens the plugins that the test configuration names. One
# row per test target lists the runtime binary and every plugin it loads.
[plan.work.runtime-artifacts]
scope = "cargo"
cargo_prerequisites = [
    { source_work = "cargo.test", when = [
        { package = "iggy-connectors", target = { name = "api", kind = "test" } },
    ], require = [
        { package = "iggy-connectors", target = { name = "iggy-connectors", kind = "bin" } },
    ] },
    { source_work = "cargo.test", when = [
        { package = "iggy-connectors", target = { name = "config_env_listing", kind = "test" } },
    ], require = [
        { package = "iggy-connectors", target = { name = "iggy-connectors", kind = "bin" } },
    ] },
    { source_work = "cargo.test", when = [
        { package = "iggy-connectors", target = { name = "http_config_provider", kind = "test" } },
    ], require = [
        { package = "iggy-connectors", target = { name = "iggy-connectors", kind = "bin" } },
        { package = "iggy_connector_random_source", target = { name = "iggy_connector_random_source", kind = "cdylib" } },
        { package = "iggy_connector_stdout_sink", target = { name = "iggy_connector_stdout_sink", kind = "cdylib" } },
    ] },
    { source_work = "cargo.test", when = [
        { package = "iggy-connectors", target = { name = "runtime", kind = "test" } },
    ], require = [
        { package = "iggy-connectors", target = { name = "iggy-connectors", kind = "bin" } },
        { package = "iggy_connector_random_source", target = { name = "iggy_connector_random_source", kind = "cdylib" } },
