# All configurations could be found here: https://github.com/apache/infrastructure-asfyaml/

github:
  description: "Apache Iggy Connectors: move data between Apache Iggy streams and external systems"
  labels:
    - apache
    - connectors
    - iggy
    - messaging
    - rust
    - streaming
  features:
    issues: true
    discussions: true
  enabled_merge_buttons:
    squash: true
    # The PR Title check guards the commit subject only if it comes from the PR title.
    squash_commit_message: PR_TITLE_AND_DESC
    merge: false
    rebase: false
  pull_requests:
    del_branch_on_merge: true
  protected_branches:
    master:
      required_status_checks:
        strict: true
        # The ASF tool does not validate these names. A name that no workflow
        # reports blocks every pull request, also one that corrects this file.
        contexts:
          - "finalize_pr"
          - "PR Title"
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        required_approving_review_count: 2
      required_conversation_resolution: true
  collaborators:
    - justinmclean

notifications:
  commits: commits@iggy.apache.org
  issues: commits@iggy.apache.org
  pullrequests: commits@iggy.apache.org
  discussions: dev@iggy.apache.org
