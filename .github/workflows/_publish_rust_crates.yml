# Publishes iggy_connector_sdk to crates.io and tags it. The SDK depends on
# the iggy and iggy_common versions that Cargo.toml pins next to R, so it
# goes out only after core released those versions at R and crates.io
# serves them.

name: _publish_rust_crates
on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        required: false
        default: false
        description: "Dry run mode - validate without publishing"
      commit:
        type: string
        required: true
        description: "Full 40-char commit SHA to publish from. The caller checks that master contains it."
      skip_tag_creation:
        type: boolean
        required: false
        default: false
        description: "Skip git tag creation after successful publish (useful for re-publishing)"

permissions:
  contents: write
  id-token: write

# publish.yml holds `publish-release` already. A direct caller would skip
# that group and race on the tag step, so this one has its own.
concurrency:
  group: publish-release-rust
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Rust crates
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Setup Rust
        uses: ./.github/actions/utils/setup-rust

      # A direct workflow_call caller skips the master check of publish.yml.
      - name: Resolve commit
        id: resolve
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          FULL_SHA=$(git rev-parse --verify "${INPUT_COMMIT}^{commit}" 2>/dev/null || true)
          if [ -z "$FULL_SHA" ] || ! [[ "$FULL_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve commit '${INPUT_COMMIT}' to a full SHA"
            exit 1
          fi
          git fetch origin master --depth=1000 --quiet
          if ! git merge-base --is-ancestor "$FULL_SHA" origin/master; then
            echo "::error::Commit $FULL_SHA is not an ancestor of origin/master"
            exit 1
          fi
          echo "commit=$FULL_SHA" >> "$GITHUB_OUTPUT"

      - name: Extract versions and tag
        id: versions
        run: |
          set -euo pipefail
          source scripts/ci/lib/core-pin.sh
          sdk=$(scripts/extract-version.sh rust-connector-sdk)
          sdk_tag=$(scripts/extract-version.sh rust-connector-sdk --tag)
          iggy=$(core_pinned_version Cargo.toml iggy)
          iggy_common=$(core_pinned_version Cargo.toml iggy_common)
          printf '%s\n' "sdk=$sdk" "sdk_tag=$sdk_tag" "iggy=$iggy" "iggy_common=$iggy_common" |
            tee -a "$GITHUB_OUTPUT"

      # A dry run fails here too: it shows what the real run would do.
      - name: Check that core released its crates at R
        run: |
          set -euo pipefail
          released=$(scripts/ci/core-released-at-r.sh)
          if [[ "$released" != true ]]; then
            echo "::error::Core has not released the iggy and iggy_common versions that Cargo.toml pins at R"
            exit 1
          fi

      # The local registry gets the core crates from the git checkout at R,
      # so a dry run needs no core release on crates.io.
      - name: Dry-run publish chain via local alt-registry
        if: inputs.dry_run == true
        env:
          CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          AUTO_INSTALL: "1"
        run: ./scripts/verify-sdk-publish.sh

      - name: Wait for iggy_common to be available
        if: inputs.dry_run == false
        uses: apache/iggy/.github/actions/utils/wait-for-crate@d88da7b2ad1d9a9b2bccdda691454d3b7ba1cfb8
        with:
          package: iggy_common
          version: ${{ steps.versions.outputs.iggy_common }}

      - name: Wait for iggy to be available
        if: inputs.dry_run == false
        uses: apache/iggy/.github/actions/utils/wait-for-crate@d88da7b2ad1d9a9b2bccdda691454d3b7ba1cfb8
        with:
          package: iggy
          version: ${{ steps.versions.outputs.iggy }}

      # A trusted-publishing token expires 30 minutes after the exchange, so
      # it is minted right before the publish. actions/rust/post-merge reads
      # env.CARGO_REGISTRY_TOKEN.
      - name: Authenticate with crates.io
        if: inputs.dry_run == false
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Export crates.io token
        if: inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: echo "CARGO_REGISTRY_TOKEN=${CARGO_REGISTRY_TOKEN}" >> "$GITHUB_ENV"

      - name: Publish iggy_connector_sdk
        if: inputs.dry_run == false
        uses: ./.github/actions/rust/post-merge
        with:
          package: iggy_connector_sdk
          version: ${{ steps.versions.outputs.sdk }}

      # The tag goes out only after crates.io serves the new version.
      - name: Wait for iggy_connector_sdk to be available
        if: inputs.dry_run == false
        uses: apache/iggy/.github/actions/utils/wait-for-crate@d88da7b2ad1d9a9b2bccdda691454d3b7ba1cfb8
        with:
          package: iggy_connector_sdk
          version: ${{ steps.versions.outputs.sdk }}

      - name: Tag iggy_connector_sdk
        if: inputs.dry_run == false && inputs.skip_tag_creation == false
        uses: apache/iggy/.github/actions/utils/create-git-tag@d88da7b2ad1d9a9b2bccdda691454d3b7ba1cfb8
        with:
          tag: ${{ steps.versions.outputs.sdk_tag }}
          commit: ${{ steps.resolve.outputs.commit }}
          message: |
            Release iggy_connector_sdk ${{ steps.versions.outputs.sdk }}

            Component: rust-connector-sdk
            Tag: ${{ steps.versions.outputs.sdk_tag }}
            Commit: ${{ steps.resolve.outputs.commit }}
            Released by: GitHub Actions (workflow ${{ github.run_id }})
