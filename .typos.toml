# Whitelist valid identifiers to avoid typos false positives
[default.extend-identifiers]
# NDJSON = Newline Delimited JSON, so "NdJson" is valid Rust CamelCase
NdJson = "NdJson"
# Rust serialization framework in CamelCase ("Ser" misread as "Set")
SerDe = "SerDe"

# Whitelist valid technical terms to avoid typos false positives
[default.extend-words]
# MQTT command-line client and broker project name. typos ignores case here,
# so this entry also covers "Mosquitto".
mosquitto = "mosquitto"

# Exclude auto-generated/non-editable files from typos check
[files]
extend-exclude = [
    # Auto-generated Rust dependency lockfile
    "**/Cargo.lock",
    # Generated base64 key and certificate bodies. The pre-commit hook runs
    # typos -w, which would rewrite a "typo" inside them and break the file.
    "**/*.pem",
]
