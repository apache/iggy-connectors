[package]
name = "iggy_connector_oracle_xstream_source"
version = "0.1.0"
description = "Iggy Oracle source connector that streams committed row changes through XStream Out"
edition = "2024"
license = "Apache-2.0"
keywords = ["iggy", "messaging", "streaming", "oracle", "cdc"]
categories = ["command-line-utilities", "database", "network-programming"]
homepage = "https://iggy.apache.org"
documentation = "https://iggy.apache.org/docs"
repository = "https://github.com/apache/iggy-connectors"
readme = "../../README.md"
publish = false

[package.metadata.cargo-machete]
# dashmap is used only inside the `source_connector!` macro expansion.
ignored = ["dashmap"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
dashmap = { workspace = true }
hex = { workspace = true }
humantime = { workspace = true }
iggy_common = { workspace = true }
iggy_connector_sdk = { workspace = true }
libloading = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rmp-serde = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
